name: Native desktop verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: runner.os == 'Windows'
        run: |
          npx playwright install chromium
          choco install ffmpeg --no-progress -y
      - if: runner.os == 'Windows'
        run: node --test tests/e2e/browser.test.cjs
      - if: runner.os != 'Linux'
        run: npm run test:coverage
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:coverage
      - run: npm audit --audit-level=moderate
      - if: runner.os == 'Windows'
        run: npm run dist:win
      - if: runner.os == 'Linux'
        run: npm run dist:linux
      - if: runner.os == 'macOS'
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: flowdm-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.tar.gz
            dist/*.zip
            test-results/*.png
            coverage/lcov.info
